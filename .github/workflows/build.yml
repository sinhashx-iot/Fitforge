name: Build FitForge APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Extract, Patch & Build
        run: |
          set -e
          
          # 1. Unzip the Phone Build Kit
          unzip -q FitForge_Phone_Build_Kit.zip -d extracted_root
          
          # 2. Locate nested zip or project files
          NESTED_ZIP=$(find extracted_root -name "FitForge_Android_Project.zip" | head -n 1)
          if [ -n "$NESTED_ZIP" ]; then
            unzip -q "$NESTED_ZIP" -d project_dir
          else
            SETTINGS_PATH=$(find extracted_root -name "settings.gradle.kts" | head -n 1)
            PROJECT_ROOT=$(dirname "$SETTINGS_PATH")
            cp -r "$PROJECT_ROOT" project_dir
          fi

          # 3. Find the exact directory containing settings.gradle.kts
          SETTINGS_FILE=$(find . -name "settings.gradle.kts" | head -n 1)
          WORK_DIR=$(dirname "$SETTINGS_FILE")
          echo "Working directory found at: $WORK_DIR"

          # 4. Patch MainActivity.kt inside the project
          MAIN_ACTIVITY=$(find "$WORK_DIR" -name "MainActivity.kt" | head -n 1)
          echo "Patching MainActivity at: $MAIN_ACTIVITY"
          cat << 'EOF' > "$MAIN_ACTIVITY"
          package com.fitforge.personal

          import android.content.Context
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.animation.*
          import androidx.compose.animation.core.*
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.text.KeyboardOptions
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.draw.scale
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.input.KeyboardType
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.lifecycle.ViewModel
          import androidx.lifecycle.ViewModelProvider
          import androidx.lifecycle.viewmodel.compose.viewModel
          import androidx.lifecycle.viewModelScope
          import com.fitforge.personal.data.AppDatabase
          import com.fitforge.personal.data.FinanceEntry
          import com.fitforge.personal.data.FitnessDay
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.flow.SharingStarted
          import kotlinx.coroutines.flow.stateIn
          import kotlinx.coroutines.launch
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class MainViewModel(private val context: Context) : ViewModel() {
              private val db = AppDatabase.getDatabase(context)
              val todayFitness = db.fitnessDao().getTodayFitness().stateIn(viewModelScope, SharingStarted.Lazily, null)
              val allFinance = db.financeDao().getAllEntries().stateIn(viewModelScope, SharingStarted.Lazily, emptyList())
              val totalIncome = db.financeDao().getTotalIncome().stateIn(viewModelScope, SharingStarted.Lazily, 0.0)
              val totalExpense = db.financeDao().getTotalExpense().stateIn(viewModelScope, SharingStarted.Lazily, 0.0)

              fun addSteps(amount: Int) = viewModelScope.launch {
                  val current = todayFitness.value ?: FitnessDay()
                  db.fitnessDao().insertOrUpdate(current.copy(steps = current.steps + amount))
              }

              fun addWorkout(minutes: Int) = viewModelScope.launch {
                  val current = todayFitness.value ?: FitnessDay()
                  db.fitnessDao().insertOrUpdate(current.copy(workoutMinutes = current.workoutMinutes + minutes))
              }

              fun addWater(ml: Int) = viewModelScope.launch {
                  val current = todayFitness.value ?: FitnessDay()
                  db.fitnessDao().insertOrUpdate(current.copy(waterMl = current.waterMl + ml))
              }

              fun addFinanceEntry(title: String, amount: Double, type: String, category: String) = viewModelScope.launch {
                  db.financeDao().insertEntry(
                      FinanceEntry(
                          title = title,
                          amount = amount,
                          type = type,
                          category = category,
                          date = SimpleDateFormat("dd MMM yyyy", Locale.getDefault()).format(Date())
                      )
                  )
              }
          }

          class MainViewModelFactory(private val context: Context) : ViewModelProvider.Factory {
              override fun <T : ViewModel> create(modelClass: Class<T>): T {
                  @Suppress("UNCHECKED_CAST")
                  return MainViewModel(context.applicationContext) as T
              }
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      FitForgeApp()
                  }
              }
          }

          @Composable
          fun FitForgeApp() {
              val context = LocalContext.current
              val vm: MainViewModel = viewModel(factory = MainViewModelFactory(context))
              var showIntro by remember { mutableStateOf(true) }

              if (showIntro) {
                  IntroScreen { showIntro = false }
              } else {
                  MainScreen(vm)
              }
          }

          @Composable
          fun IntroScreen(onComplete: () -> Unit) {
              val infiniteTransition = rememberInfiniteTransition(label = "pulse")
              val scale by infiniteTransition.animateFloat(
                  initialValue = 0.95f,
                  targetValue = 1.05f,
                  animationSpec = infiniteRepeatable(
                      animation = tween(1200, easing = FastOutSlowInEasing),
                      repeatMode = RepeatMode.Reverse
                  ),
                  label = "scale"
              )

              LaunchedEffect(Unit) {
                  delay(2600)
                  onComplete()
              }

              Box(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(
                          Brush.radialGradient(
                              colors = listOf(Color(0xFF2A164D), Color(0xFF0D0B14)),
                              radius = 1200f
                          )
                      ),
                  contentAlignment = Alignment.Center
              ) {
                  Column(
                      horizontalAlignment = Alignment.CenterHorizontally,
                      verticalArrangement = Arrangement.Center
                  ) {
                      Box(
                          modifier = Modifier
                              .size(130.dp)
                              .scale(scale)
                              .clip(CircleShape)
                              .background(
                                  Brush.linearGradient(
                                      listOf(Color(0xFFFF3366), Color(0xFFFF9933))
                                  )
                              ),
                          contentAlignment = Alignment.Center
                      ) {
                          Text(
                              text = "F",
                              color = Color.White,
                              fontSize = 64.sp,
                              fontWeight = FontWeight.Black
                          )
                      }

                      Spacer(modifier = Modifier.height(28.dp))

                      Text(
                          text = "FITFORGE",
                          color = Color.White,
                          fontSize = 32.sp,
                          fontWeight = FontWeight.ExtraBold,
                          letterSpacing = 6.sp
                      )

                      Text(
                          text = "TRAIN • TRACK • CONQUER",
                          color = Color(0xFFFFAA44),
                          fontSize = 12.sp,
                          fontWeight = FontWeight.Bold,
                          letterSpacing = 3.sp,
                          modifier = Modifier.padding(top = 8.dp)
                      )
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun MainScreen(vm: MainViewModel) {
              var selectedTab by remember { mutableIntStateOf(0) }
              val todayFitness by vm.todayFitness.collectAsState()
              val allFinance by vm.allFinance.collectAsState()
              val income by vm.totalIncome.collectAsState()
              val expense by vm.totalExpense.collectAsState()
              var showAddExpenseDialog by remember { mutableStateOf(false) }

              Scaffold(
                  containerColor = Color(0xFF10121A),
                  topBar = {
                      TopAppBar(
                          title = {
                              Text(
                                  text = if (selectedTab == 0) "FITFORGE" else "FINANCES",
                                  fontWeight = FontWeight.Black,
                                  letterSpacing = 2.sp,
                                  color = Color.White
                              )
                          },
                          colors = TopAppBarDefaults.topAppBarColors(containerColor = Color(0xFF161822))
                      )
                  },
                  bottomBar = {
                      NavigationBar(containerColor = Color(0xFF161822)) {
                          NavigationBarItem(
                              selected = selectedTab == 0,
                              onClick = { selectedTab = 0 },
                              icon = { Icon(Icons.Default.FitnessCenter, contentDescription = null) },
                              label = { Text("Fitness") }
                          )
                          NavigationBarItem(
                              selected = selectedTab == 1,
                              onClick = { selectedTab = 1 },
                              icon = { Icon(Icons.Default.AccountBalanceWallet, contentDescription = null) },
                              label = { Text("Finance") }
                          )
                      }
                  },
                  floatingActionButton = {
                      if (selectedTab == 1) {
                          FloatingActionButton(
                              onClick = { showAddExpenseDialog = true },
                              containerColor = Color(0xFFFF3366),
                              contentColor = Color.White
                          ) {
                              Icon(Icons.Default.Add, contentDescription = "Add Transaction")
                          }
                      }
                  }
              ) { padding ->
                  Box(modifier = Modifier.padding(padding).fillMaxSize().padding(16.dp)) {
                      if (selectedTab == 0) {
                          FitnessTab(todayFitness, vm)
                      } else {
                          FinanceTab(income ?: 0.0, expense ?: 0.0, allFinance)
                      }
                  }

                  if (showAddExpenseDialog) {
                      AddTransactionDialog(
                          onDismiss = { showAddExpenseDialog = false },
                          onAdd = { title, amt, type, cat ->
                              vm.addFinanceEntry(title, amt, type, cat)
                              showAddExpenseDialog = false
                          }
                      )
                  }
              }
          }

          @Composable
          fun FitnessTab(today: FitnessDay?, vm: MainViewModel) {
              val current = today ?: FitnessDay()
              LazyColumn(verticalArrangement = Arrangement.spacedBy(16.dp)) {
                  item {
                      MetricCard("Steps Taken", "${current.steps} / 10,000", (current.steps / 10000f).coerceIn(0f, 1f), Color(0xFFFF9933))
                  }
                  item {
                      MetricCard("Workout Time", "${current.workoutMinutes} min / 60 min", (current.workoutMinutes / 60f).coerceIn(0f, 1f), Color(0xFFFF3366))
                  }
                  item {
                      MetricCard("Water Intake", "${current.waterMl} ml / 3,000 ml", (current.waterMl / 3000f).coerceIn(0f, 1f), Color(0xFF33CCFF))
                  }
                  item {
                      Text("Quick Log", fontWeight = FontWeight.Bold, color = Color.White, fontSize = 18.sp)
                  }
                  item {
                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp), modifier = Modifier.fillMaxWidth()) {
                          Button(onClick = { vm.addSteps(500) }, modifier = Modifier.weight(1f)) { Text("+500 Steps") }
                          Button(onClick = { vm.addWorkout(15) }, modifier = Modifier.weight(1f)) { Text("+15m Gym") }
                          Button(onClick = { vm.addWater(250) }, modifier = Modifier.weight(1f)) { Text("+250ml") }
                      }
                  }
              }
          }

          @Composable
          fun MetricCard(title: String, subtitle: String, progress: Float, color: Color) {
              Card(
                  colors = CardDefaults.cardColors(containerColor = Color(0xFF1E2130)),
                  shape = RoundedCornerShape(16.dp),
                  modifier = Modifier.fillMaxWidth()
              ) {
                  Column(modifier = Modifier.padding(16.dp)) {
                      Text(title, color = Color.Gray, fontSize = 14.sp)
                      Text(subtitle, color = Color.White, fontWeight = FontWeight.Bold, fontSize = 22.sp, modifier = Modifier.padding(vertical = 6.dp))
                      LinearProgressIndicator(
                          progress = { progress },
                          modifier = Modifier.fillMaxWidth().height(8.dp).clip(CircleShape),
                          color = color,
                          trackColor = Color(0xFF2C3147)
                      )
                  }
              }
          }

          @Composable
          fun FinanceTab(income: Double, expense: Double, list: List<FinanceEntry>) {
              LazyColumn(verticalArrangement = Arrangement.spacedBy(14.dp)) {
                  item {
                      Card(
                          colors = CardDefaults.cardColors(containerColor = Color(0xFF1E2130)),
                          shape = RoundedCornerShape(16.dp),
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Column(modifier = Modifier.padding(18.dp)) {
                              Text("Net Balance", color = Color.Gray)
                              Text("₹${String.format(Locale.getDefault(), "%.2f", income - expense)}", color = Color.White, fontWeight = FontWeight.Black, fontSize = 28.sp)
                              Spacer(modifier = Modifier.height(12.dp))
                              Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                                  Text("Income: +₹${String.format(Locale.getDefault(), "%.2f", income)}", color = Color(0xFF00E676), fontWeight = FontWeight.Bold)
                                  Text("Spent: -₹${String.format(Locale.getDefault(), "%.2f", expense)}", color = Color(0xFFFF5252), fontWeight = FontWeight.Bold)
                              }
                          }
                      }
                  }
                  item {
                      Text("Recent Transactions", fontWeight = FontWeight.Bold, color = Color.White, fontSize = 18.sp)
                  }
                  if (list.isEmpty()) {
                      item {
                          Text("No transactions logged yet.", color = Color.Gray, modifier = Modifier.padding(top = 10.dp))
                      }
                  } else {
                      items(list) { item ->
                          Card(
                              colors = CardDefaults.cardColors(containerColor = Color(0xFF161822)),
                              modifier = Modifier.fillMaxWidth()
                          ) {
                              Row(
                                  modifier = Modifier.fillMaxWidth().padding(14.dp),
                                  horizontalArrangement = Arrangement.SpaceBetween,
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Column {
                                      Text(item.title, color = Color.White, fontWeight = FontWeight.SemiBold)
                                      Text("${item.category} • ${item.date}", color = Color.Gray, fontSize = 12.sp)
                                  }
                                  Text(
                                      text = (if (item.type == "income") "+₹" else "-₹") + String.format(Locale.getDefault(), "%.2f", item.amount),
                                      color = if (item.type == "income") Color(0xFF00E676) else Color(0xFFFF5252),
                                      fontWeight = FontWeight.Bold
                                  )
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun AddTransactionDialog(onDismiss: () -> Unit, onAdd: (String, Double, String, String) -> Unit) {
              var title by remember { mutableStateOf("") }
              var amount by remember { mutableStateOf("") }
              var type by remember { mutableStateOf("expense") }
              var category by remember { mutableStateOf("General") }

              AlertDialog(
                  onDismissRequest = onDismiss,
                  title = { Text("New Transaction") },
                  text = {
                      Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                          OutlinedTextField(value = title, onValueChange = { title = it }, label = { Text("Title") })
                          OutlinedTextField(
                              value = amount,
                              onValueChange = { amount = it },
                              label = { Text("Amount (₹)") },
                              keyboardOptions = Ke
